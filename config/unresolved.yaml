# Items that need an owner decision. Rendered into ENVIRONMENT_READY.md §15. Remove an item once decided.
- title: "Dependency caps raised on feature/environment (cryptography <51, pytest <10)"
  detail: "pip-audit found 4 advisories in cryptography 46.0.7 (fixes need ≥ 50.0.0) and 1 in pytest 8.4.2 (fixed 9.0.3). The caps in pyproject.toml were raised and the lock now pins cryptography 50.0.2 / pytest 9.1.1; the full suite was re-run against them (see validation). This changes the library's published dependency range, so it needs your review before it reaches development/main."
- title: "SSH hardening"
  detail: "PasswordAuthentication yes and PermitRootLogin yes on port 2244 (fail2ban active). Recommended: key-only root (prohibit-password) after confirming key login from every client. Not changed automatically — a wrong change locks the owner out."
- title: "ufw allows 8000/tcp and 8001/tcp from anywhere"
  detail: "Services there bind 127.0.0.1 today; restrict to tailscale0 or remove. Shared with VNX Weather, so not changed by VNX-DNA work."
- title: "18 GB local model provenance"
  detail: "huihui_ai/qwen3-coder-abliterated is a refusal-removed community fine-tune (5/5 on the coding probe, 17.7 GiB RSS). It is classed untrusted and gets no tools. Keep, replace with an official Qwen3-Coder build, or remove — owner's choice; nothing was deleted."
- title: "Competitor harnesses"
  detail: "No competitor implementation has been pinned/inspected yet; all competitor rows are NOT REPRODUCIBLE LOCALLY until one is added under benchmarks/competitors/ (benchmarks/COMPETITIVE.md)."
- title: "Remote budget cap"
  detail: "config/laya/approvals.yaml sets $5/day and $1/task for agent-CLI runs launched by LAYA (measured from total_cost_usd). Adjust to your plan."
- title: "One unidentified test failure under concurrent load (observed once)"
  detail: "During a full run executed at the same time as an agent's pytest_fast run, pytest reported 1 failed / 597 passed / 3 skipped; the output filter dropped the test name. Two further full runs (one deliberately concurrent, with -rf and junit) gave 601/601. Treat as a possible load-sensitive (timing) test; if it recurs, the junit/-rf output of governed runs (reports/gates, artifacts/harness) will name it."
- title: "Validation fixes made during PHASE 18"
  detail: "Checks 6, 11 and 13 failed on the first run and passed after fixes: (6) the check used Poisson 1× coverage (≈37 % strands unread) — now fixed 1×; (11) the queue check's request was correctly deferred by the governor while the test class was saturated — now uses a misc-class request; (13) bundle verification depended on the caller's cwd (`git bundle verify` needs a repository) — now verified in an empty temporary repo, with a regression test. Also fixed: governed test runs lacked the venv on PATH (3 README tests skipped)."
