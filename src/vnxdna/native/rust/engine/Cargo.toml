[package]
name = "vnx_engine"
version = "1.0.0"
edition = "2021"
rust-version = "1.75"   # the toolchain it is built and tested with (let-else needs >= 1.65; Debian 12 ships 1.63)
publish = false
description = "VNX-DNA V13 streaming decode engine: pass 1 end to end (IO, scan, orientation, address scheduling, decode attempts, spill) behind a C ABI"
license = "MIT"
build = "build.rs"

[lib]
name = "vnx_engine"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

# No third-party crates: the engine builds offline with the standard library only. The reused C kernels (inner RS,
# marker-template DP, orientation/projection/packing) are compiled into the library by build.rs with the system C
# compiler.
[dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "unwind"   # panics are caught at the C ABI boundary (catch_unwind) and returned as an error code
debug = false
