[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "vnx-dna"
dynamic = ["version"]
description = "VNX-DNA: scalable computational DNA data storage (streaming archives, AES-256-GCM, MDS erasure coding, DNA encoding, sequencing simulation, clustering, consensus, recovery)"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "VS Nexus Technologies"}]
dependencies = [
    "numpy>=2.0,<3",
    "cryptography>=44,<47",
    "zstandard>=0.23,<1",
    "reedsolo>=1.7,<2",
    "pydantic>=2.10,<3",
    "typer>=0.15,<1",
]

[project.optional-dependencies]
fit = ["edlib>=1.3.9,<2"]    # V7 channel-model fitting (experiments and vnxdna.simulation.fit); never imported by the codec
dev = ["pytest>=8,<9", "pytest-cov>=6,<8", "hypothesis>=6.100,<7", "ruff>=0.6,<1", "jsonschema>=4.18,<5"]

[project.scripts]
vnx-dna = "vnxdna._entry:main"
vnxdna = "vnxdna._entry:main"
vnx = "vnxdna.commands:main"

[tool.setuptools.dynamic]
version = {attr = "vnxdna._version.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"vnxdna.v5" = ["native/*.c"]
"vnxdna.v6" = ["native/*.c"]
"vnxdna.native" = ["c/*.c"]
"vnxdna.core" = ["schemas/*.json"]
"vnxdna.physical" = ["schemas/*.json"]
"vnxdna.simulation" = ["models/*.json"]
"vnxdna.conformance" = ["vectors/**/*"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: long-running exhaustive/statistical tests (run by default; deselect with -m 'not slow')"]

[tool.coverage.run]
source = ["vnxdna"]

[tool.mypy]
# CI static-analysis gate (job `mypy`): the V6 layered packages and the legacy v2/v4/ecc decoders (job #58), all of
# which type-check cleanly today. Errors in imported modules outside this set are not reported
# (follow_imports = "silent"). Not yet gated (open mypy errors): vnxdna.archive, vnxdna.sync, vnxdna.recovery,
# vnxdna.pipeline, vnxdna.benchmark. Run with: mypy   (from the repository root)
python_version = "3.12"
mypy_path = "src"
follow_imports = "silent"
packages = ["vnxdna.core", "vnxdna.native", "vnxdna.codec", "vnxdna.dnaenc", "vnxdna.simulation", "vnxdna.sdk",
            "vnxdna.conformance", "vnxdna.commands", "vnxdna.v6", "vnxdna.v2", "vnxdna.v4", "vnxdna.ecc"]

[[tool.mypy.overrides]]
module = ["reedsolo", "reedsolo.*", "jsonschema", "jsonschema.*", "edlib", "edlib.*"]    # no type information shipped
ignore_missing_imports = true

[tool.ruff]
target-version = "py312"
line-length = 140
# Archived historical code is kept exactly as it was found (see research/legacy/README.md).
extend-exclude = ["research/legacy", "research/v0_1_forensics", "research/v2/overview_pdf"]

[tool.ruff.lint]
select = ["F"]  # pyflakes: undefined names, unused imports/variables, redefinitions

[tool.ruff.lint.per-file-ignores]
# The V1 (1.0.0) modules are kept byte-identical to the v1.0.0 release (V1 archives are read by the exact code that
# wrote them); only their unused imports are reported here, which cannot affect behaviour.
"src/vnxdna/api.py" = ["F401"]
"src/vnxdna/bench.py" = ["F401"]
"src/vnxdna/channel.py" = ["F401"]
"src/vnxdna/cli_v1.py" = ["F401", "F541"]
"tests/conftest.py" = ["F401"]  # re-exports for older imports
