name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: vnx-dna --help
      # the install must have built every native kernel (python -m vnxdna.native prints the backends)
      - run: python -m vnxdna.native --require-native
      # strict builds: compiler warnings are errors here (installs and local builds do not use -Werror)
      - run: |
          python -m vnxdna.v5.native_alignment build --strict
          python -m vnxdna.v6.native_reads build --strict
          python -m vnxdna.v6.native_rs build --strict
      - run: ruff check src tests research
      - run: python -m pytest
      - run: python -m compileall -q src
  install:
    # fresh virtual environments: pip install . (all kernels native), CC=/bin/false (installs, reference), pip wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - run: python -m pip install -e '.[dev]'   # the test suite's conftest needs the dependencies
      - run: VNXDNA_INSTALL_TEST=1 python -m pytest -o addopts= -p no:cacheprovider tests/v6/native/test_install.py

  # ---- security jobs (V6 Phase 6). Separate jobs: they never change the `test` job above.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: {fetch-depth: 0}            # full history: a secret removed later is still a leak
      - name: gitleaks (full history, redacted; reviewed test keys are listed in .gitleaksignore, see docs/SECURITY.md)
        env: {GITLEAKS_VERSION: 8.30.1}
        run: |
          curl -sSfL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks git --no-banner --redact --exit-code 1 --log-opts=--all .

  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - run: python -m pip install --upgrade pip pip-audit
      - run: python -m pip install -e '.[dev]'
      # Each ignored ID is triaged as not reachable in docs/SECURITY.md ("MEDIUM scan findings"); the pins
      # cryptography<47 and pytest<9 await a founder decision. Any other advisory fails this job.
      - run: >-
          pip-audit --skip-editable --progress-spinner off
          --ignore-vuln PYSEC-2026-3552 --ignore-vuln PYSEC-2026-3553 --ignore-vuln PYSEC-2026-3554
          --ignore-vuln GHSA-537c-gmf6-5ccf --ignore-vuln PYSEC-2026-1845

  fuzz-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - name: build the native kernels (the fuzz targets compare them with the references)
        run: |
          python -m vnxdna.v5.native_alignment build
          python -m vnxdna.v6.native_reads build
          python -m vnxdna.v6.native_rs build
      - name: fuzz smoke (Python targets + libFuzzer ASan/UBSan harnesses; skipped if clang has no libFuzzer)
        run: python -m pytest tests/fuzz -q

  # ---- directive §23 jobs (V6). Separate jobs: they never change the `test` job above. Heavy benchmarks are not run in CI.
  mypy:
    # static analysis: the packages listed under [tool.mypy] in pyproject.toml (the clean set: the V6 packages and the
    # legacy v2/v4/ecc decoders). Packages with open errors (vnxdna.archive, sync, recovery, pipeline, benchmark) are
    # not gated yet.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]' 'mypy==2.4.0'
      - run: mypy

  sanitizers:
    # ASan+UBSan builds (gcc; clang ASan+UBSan and UBSan trap mode) of all three native kernels (align, reads, rs),
    # each running its native equivalence tests, a differential stress fuzz against the reference and an ASan canary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - name: clang and its sanitizer runtimes
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang libclang-rt-dev
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: bash tools/sanitizers.sh "$RUNNER_TEMP/sanitizers"

  conformance:
    # conformance vectors (spec §6) through the CLI on both backends; each must answer CONFORMANT (exit 0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m vnxdna.native --require-native
      - run: vnx conformance --backend native
      - run: vnx conformance --backend reference

  benchmark-smoke:
    # a tiny benchmark run (64 KB): it must run and emit valid JSON with lossless end-to-end cases. No timing thresholds.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: vnx benchmark --size 64KB --output "$RUNNER_TEMP/bench.json"
      - run: python tools/check_benchmark_json.py "$RUNNER_TEMP/bench.json"

  docs:
    # relative links in README.md and docs/**/*.md must resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - run: python tools/check_doc_links.py
